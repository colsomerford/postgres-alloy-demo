# For postgres running with alloy
services:
  db:
    image: postgres:latest
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    container_name: my-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mydatabase
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
      - ./alloy/alloy-postgres.conf:/etc/postgresql/postgresql.conf
  alloy:  
    image: grafana/alloy:latest
    container_name: my-alloy  
    ports:  
      - "12345:12345"   
    volumes:  
      - "./alloy/config.alloy:/etc/alloy/config.alloy:ro"  
    command: run --server.http.listen-addr=0.0.0.0:12345 /etc/alloy/config.alloy  
    environment:
      - FM_URL=${FM_URL}
      - FM_USERNAME=${FM_USERNAME}
      - GCLOUD_RW_API_KEY=${GCLOUD_RW_API_KEY}  
      - GCLOUD_FM_LOG_PATH=/var/log/alloy  
      - DB_POSTGRES_DSN=${DB_POSTGRES_DSN}
      - GCLOUD_HOSTED_METRICS_URL=${GCLOUD_HOSTED_METRICS_URL}
      - GCLOUD_HOSTED_METRICS_ID=${GCLOUD_HOSTED_METRICS_ID}
      - GCLOUD_HOSTED_LOGS_URL=${GCLOUD_HOSTED_LOGS_URL}
      - GCLOUD_HOSTED_LOGS_ID=${GCLOUD_HOSTED_LOGS_ID}
      - GCLOUD_OTLP_ENDPOINT=${GCLOUD_HOSTED_OTLP_ENDPOINT}
      - GCLOUD_OTLP_INSTANCE_ID=${GCLOUD_HOSTED_OTLP_INSTANCE_ID}
  
volumes:
  pgdata: